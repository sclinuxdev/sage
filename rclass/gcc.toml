schema_version = 1
name = "gcc"
description = "GNU Compiler Collection out-of-tree build class"

implicit_build_dependencies = [
    "system/binutils",
    "system/bison",
    "system/flex",
    "system/gawk",
    "system/gmp-dev",
    "system/isl-dev",
    "system/make",
    "system/mpc-dev",
    "system/mpfr-dev",
    "system/texinfo",
    "system/zlib-dev",
]
allowed_compilers = ["clang", "gcc"]
allowed_linkers = ["lld", "mold", "ld"]

[defaults]
"args.configure_args" = ""
"args.install_args" = ""
"args.make_args" = ""
"args.source_dir" = "."

[phases]
src_unpack = """
tab=$(printf '\\t')
while IFS="$tab" read -r source kind strip destination; do
    input="${SRC_DIR}/.distfiles/$source"
    target="${SRC_DIR}/$destination"
    case "$kind" in
        archive)
            mkdir -p "$target"
            tar -xf "$input" --strip-components="$strip" -C "$target"
            ;;
        tree)
            mkdir -p "$target"
            cp -a "$input"/. "$target"/
            ;;
        file)
            mkdir -p "$(dirname "$target")"
            cp -a "$input" "$target"
            ;;
        *)
            echo "unsupported source manifest kind: $kind" >&2
            exit 1
            ;;
    esac
done < "${SRC_DIR}/.distfiles/manifest"
"""

src_prepare = """
patch_root="${SRC_DIR}/${args.source_dir}"
if [ -d "${SRC_DIR}/.patches" ]; then
    for patch_file in "${SRC_DIR}"/.patches/*; do
        [ -f "$patch_file" ] || continue
        patch -d "$patch_root" -p1 < "$patch_file"
    done
fi
if [ -d "${SRC_DIR}/.source-patches" ]; then
    for patch_file in "${SRC_DIR}"/.source-patches/*; do
        [ -f "$patch_file" ] || continue
        patch -d "$patch_root" -p1 < "$patch_file"
    done
fi
"""

src_configure = """
mkdir -p "${BUILD_DIR}"
cd "${BUILD_DIR}"
"${SRC_DIR}/${args.source_dir}/configure" \
    --prefix=/usr \
    --libdir=/usr/lib \
    --enable-languages=c,c++ \
    --disable-multilib \
    --enable-default-pie \
    --enable-default-ssp \
    --enable-lto \
    --enable-plugin \
    --enable-threads=posix \
    --enable-__cxa_atexit \
    --enable-clocale=gnu \
    --with-system-zlib \
    --with-isl \
    --disable-werror \
    ${args.configure_args}
"""

src_compile = "make -C \"${BUILD_DIR}\" -j \"${JOBS}\" ${args.make_args}"
src_install = "make -C \"${BUILD_DIR}\" DESTDIR=\"${DESTDIR}\" install ${args.install_args}"
