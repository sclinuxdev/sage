schema_version = 1
name = "cargo"
description = "Rust Cargo build class"

implicit_build_dependencies = ["rustc", "cargo"]
allowed_compilers = ["rustc", "clang", "gcc"]
allowed_linkers = ["lld", "mold", "ld"]

[defaults]
"args.target_arg" = ""

[env]
CARGO_BUILD_JOBS = "${JOBS}"
RUSTFLAGS = "${RUSTFLAGS}"

[phases]
src_unpack = """
tab=$(printf '\t')
while IFS="$tab" read -r archive strip destination; do
    target="${SRC_DIR}/$destination"
    mkdir -p "$target"
    input="${SRC_DIR}/.distfiles/$archive"
    if [ -d "$input" ]; then cp -a "$input"/. "$target"/; else tar -xf "$input" --strip-components="$strip" -C "$target"; fi
done < "${SRC_DIR}/.distfiles/manifest"
"""

src_prepare = """
if [ -d "${SRC_DIR}/.patches" ]; then
    for patch_file in "${SRC_DIR}"/.patches/*; do
        patch -d "${SRC_DIR}" -p1 < "$patch_file"
    done
fi
"""

src_compile = """
cargo build --release --locked --manifest-path "${SRC_DIR}/Cargo.toml" --target-dir "${BUILD_DIR}/target" ${args.target_arg}
"""

src_install = """
cargo install --locked --root "${DESTDIR}/usr" --path "${SRC_DIR}" ${args.target_arg}
"""
