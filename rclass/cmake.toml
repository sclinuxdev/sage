schema_version = 1
name = "cmake"
description = "CMake and Ninja build class"

implicit_build_dependencies = ["cmake", "ninja"]
allowed_compilers = ["clang", "gcc"]
allowed_linkers = ["lld", "mold", "ld"]

[env]
CMAKE_BUILD_PARALLEL_LEVEL = "${JOBS}"

[phases]
src_unpack = """
first=1
for archive in "${SRC_DIR}"/.distfiles/*; do
    if [ "$first" -eq 1 ]; then
        tar -xf "$archive" --strip-components=1 -C "${SRC_DIR}"
        first=0
    else
        tar -xf "$archive" -C "${SRC_DIR}"
    fi
done
"""

src_prepare = """
if [ -d "${SRC_DIR}/.patches" ]; then
    for patch_file in "${SRC_DIR}"/.patches/*; do
        patch -d "${SRC_DIR}" -p1 < "$patch_file"
    done
fi
"""

src_configure = """
cmake -B "${BUILD_DIR}" -G Ninja \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_INSTALL_LIBDIR=lib \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_C_FLAGS="${CFLAGS}" \
    -DCMAKE_CXX_FLAGS="${CXXFLAGS}" \
    -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS}" \
    ${args.cmake_args} \
    "${SRC_DIR}"
"""

src_compile = """
ninja -C "${BUILD_DIR}" -j "${JOBS}"
"""

src_install = """
DESTDIR="${DESTDIR}" ninja -C "${BUILD_DIR}" install
"""
