schema_version = 1
name = "cmake"
description = "CMake and Ninja build class"

implicit_build_dependencies = ["cmake", "ninja"]
allowed_compilers = ["clang", "gcc"]
allowed_linkers = ["lld", "mold", "ld"]

[defaults]
"args.cmake_args" = ""
"args.cross_args" = ""

[env]
CMAKE_BUILD_PARALLEL_LEVEL = "${JOBS}"

[phases]
src_unpack = """
tab=$(printf '\t')
while IFS="$tab" read -r source kind strip destination; do
    input="${SRC_DIR}/.distfiles/$source"
    target="${SRC_DIR}/$destination"
    case "$kind" in
        archive)
            mkdir -p "$target"
            tar -xf "$input" --strip-components="$strip" -C "$target"
            ;;
        tree)
            mkdir -p "$target"
            cp -a "$input"/. "$target"/
            ;;
        file)
            mkdir -p "$(dirname "$target")"
            cp -a "$input" "$target"
            ;;
        *)
            echo "unsupported source manifest kind: $kind" >&2
            exit 1
            ;;
    esac
done < "${SRC_DIR}/.distfiles/manifest"
"""

src_prepare = """
if [ -d "${SRC_DIR}/.patches" ]; then
    for patch_file in "${SRC_DIR}"/.patches/*; do
        patch -d "${SRC_DIR}" -p1 < "$patch_file"
    done
fi
"""

src_configure = """
cmake -B "${BUILD_DIR}" -G Ninja \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_INSTALL_LIBDIR=lib \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_C_FLAGS="${CFLAGS}" \
    -DCMAKE_CXX_FLAGS="${CXXFLAGS}" \
    -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS}" \
    ${args.cross_args} \
    ${args.cmake_args} \
    "${SRC_DIR}"
"""

src_compile = """
ninja -C "${BUILD_DIR}" -j "${JOBS}"
"""

src_install = """
DESTDIR="${DESTDIR}" ninja -C "${BUILD_DIR}" install
"""
