# Sage build execution, toolchain and parallelism policy.
schema_version = 1
fakeroot = "fakeroot"
# Full read-only root exposed to v2 builds. Point this at a populated package
# sysroot for hermetic builds; `/` is the native bootstrap default.
sysroot = "/"

cc = "clang"
cxx = "clang++"
linker = "ld.lld"
fallback_cc = "gcc"
fallback_cxx = "g++"
fallback_linker = "ld"
rustc = "rustc"

cflags = "-O3 -march=x86-64-v3"
cxxflags = ""
cppflags = ""
ldflags = ""
rustflags = ""

jobs = 0
compile_jobs = 0
